# Release Forestly GO — wystawiany automatycznie po wypchnięciu tagu vX.Y.Z
# (release.py robi resztę: commit, tag, changelog w RELEASE_NOTES.md).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zbuduj paczkę forestly-go.zip
        run: |
          zip -r forestly-go.zip . -x ".git/*" ".github/*" "*.zip"

      - name: Utwórz Release z changelogiem
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: forestly-go.zip
